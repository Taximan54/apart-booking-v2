<style>
:root{--gold:#C9A84C;--black:#0A0A0A;--black-card:#141414;--black-border:#1E1E1E;--text-primary:#F0E6C8;--text-secondary:#A89060;--text-muted:#5A4A30;
--brand-font:'Cormorant Garamond',serif;--brand-weight:300;--brand-scale:1;
--title-font:'Cormorant Garamond',serif;--title-weight:300;--title-scale:1;
--subtitle-font:'Montserrat',sans-serif;--subtitle-weight:400;--subtitle-scale:1;
--card-font:'Cormorant Garamond',serif;--card-weight:400;--card-scale:1;
--text-font:'Montserrat',sans-serif;--text-weight:400;--text-scale:1;}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--text-font);background:var(--black);color:var(--text-primary);line-height:1.7;min-height:100vh;transition:opacity .25s ease}
html.cp-wait body{opacity:0}
header{padding:24px 60px;border-bottom:1px solid var(--black-border);display:flex;align-items:center;justify-content:space-between}
.logo{font-family:var(--brand-font);font-size:calc(24px * var(--brand-scale));font-weight:var(--brand-weight);color:var(--gold);letter-spacing:.3em;text-decoration:none}
.container{max-width:1240px;margin:0 auto;padding:60px 40px}
.container.wide{max-width:1500px}
h1{font-family:var(--title-font);font-size:calc(46px * var(--title-scale));font-weight:var(--title-weight);color:var(--text-primary);margin-bottom:12px;text-align:center}
.subtitle{font-family:var(--subtitle-font);font-size:calc(13px * var(--subtitle-scale));font-weight:var(--subtitle-weight);color:var(--text-muted);text-align:center;margin-bottom:56px;letter-spacing:.05em}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:32px;align-items:stretch}
.cards.cols-1{grid-template-columns:minmax(0,640px);justify-content:center}
.cards.cols-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.cards.cols-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.cards.cols-4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:1199px){.cards.cols-3,.cards.cols-4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.cards.single{max-width:560px;margin:0 auto}
.card{background:var(--black-card);border:1px solid var(--black-border);overflow:hidden;display:flex;flex-direction:column;height:100%;transition:border-color .3s}
.card:hover{border-color:var(--gold)}
/* Фото: листаются стрелками, точками и свайпом */
.slider{position:relative;overflow:hidden;aspect-ratio:4/3;background:var(--black-border);outline:none}
.track{display:flex;height:100%;transition:transform .45s ease}
.slide{flex:0 0 100%;height:100%;position:relative}
.slide img{width:100%;height:100%;object-fit:cover;display:block}
.slider.empty{display:flex;align-items:center;justify-content:center;font-size:44px;color:var(--text-muted)}
.arrow{position:absolute;top:50%;transform:translateY(-50%);width:42px;height:42px;border:none;border-radius:50%;background:rgba(10,10,10,.55);color:#fff;font-size:24px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .2s,opacity .2s;opacity:.85}
.arrow:hover{background:rgba(10,10,10,.85);opacity:1}
.arrow.prev{left:12px}.arrow.next{right:12px}
.dots{position:absolute;left:0;right:0;bottom:12px;display:flex;justify-content:center;gap:6px;pointer-events:none}
.dots span{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.45);transition:background .2s,transform .2s}
.dots span.on{background:#fff;transform:scale(1.25)}
.counter{position:absolute;top:12px;right:12px;font-size:11px;letter-spacing:.08em;color:#fff;background:rgba(10,10,10,.55);padding:3px 10px;border-radius:12px}
.body{padding:24px 24px 26px;display:flex;flex-direction:column;gap:12px;flex:1}
.name{font-family:var(--card-font);font-size:calc(30px * var(--card-scale));font-weight:var(--card-weight);line-height:1.2}
.name a{color:var(--text-primary);text-decoration:none}
.name a:hover{color:var(--gold)}
.caption{font-family:var(--text-font);font-size:calc(14px * var(--text-scale));font-weight:var(--text-weight);color:var(--text-secondary);line-height:1.6;white-space:pre-line}
.amen{display:flex;flex-wrap:wrap;gap:8px}
.amen span{font-family:var(--text-font);font-size:calc(12px * var(--text-scale));color:var(--text-secondary);border:1px solid var(--black-border);padding:4px 10px;white-space:nowrap}
.foot{margin-top:auto;padding-top:14px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;border-top:1px solid var(--black-border)}
.price{font-family:var(--text-font);font-size:calc(12px * var(--text-scale));color:var(--text-muted)}
.price b{font-family:var(--card-font);font-size:calc(26px * var(--card-scale));font-weight:var(--card-weight);color:var(--text-primary)}
.btn{display:inline-block;padding:12px 22px;font-family:var(--text-font);font-size:calc(11px * var(--text-scale));letter-spacing:.18em;text-transform:uppercase;text-decoration:none;color:var(--black);background:var(--gold);transition:opacity .3s}

.search{display:none;max-width:820px;margin:-24px auto 44px;padding:14px;border:1px solid var(--black-border);background:var(--black-card);border-radius:28px;box-shadow:0 10px 30px rgba(0,0,0,.18);--tint:rgba(201,168,76,.18);--glow:rgba(201,168,76,.3)}
@supports (background:color-mix(in srgb,red 50%,transparent)){.search{--tint:color-mix(in srgb,var(--gold) 20%,transparent);--glow:color-mix(in srgb,var(--gold) 32%,transparent)}}
.search.on{display:block}
.search [hidden]{display:none!important}
.search .sbar{display:flex;gap:10px;flex-wrap:wrap;align-items:stretch}
.search .sfield{flex:2 1 340px;min-width:0;text-align:left;display:flex;align-items:center;padding:0 6px;min-height:58px;border:1px solid var(--black-border);border-radius:20px;background:transparent;color:var(--text-primary);cursor:pointer;font:inherit;transition:border-color .2s,box-shadow .2s}
.search .sfield:hover{border-color:var(--gold)}
.search .sfield.act{border-color:var(--gold);box-shadow:0 0 0 3px var(--glow)}
.search .shalf{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;padding:8px 16px}
.search .sdiv{flex:0 0 1px;height:32px;background:var(--black-border)}
.search .shalf.act .slabel{color:var(--gold)}
.search .slabel{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--text-secondary)}
.search .sval{font-size:15px;color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search .sval.ph{color:var(--text-muted)}
.search .spill{min-height:58px;padding:0 30px;border-radius:999px;font-family:var(--text-font);font-size:11px;letter-spacing:.18em;text-transform:uppercase;cursor:pointer;border:1px solid var(--gold);transition:opacity .2s,transform .2s}
.search .spill:hover:not(:disabled){transform:translateY(-1px)}
.search .spill:disabled{opacity:.6;cursor:default}
.search .go{background:var(--gold);color:var(--black);font-weight:600}
.search .reset{background:transparent;color:var(--text-secondary);border-color:var(--black-border)}
.search .reset:hover{border-color:var(--gold);color:var(--text-primary)}
.search .cal{position:relative;margin-top:12px;padding:20px 18px 14px;border:1px solid var(--black-border);border-radius:22px;animation:calIn .22s ease}
@keyframes calIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.search .cal-arrow{position:absolute;top:16px;width:36px;height:36px;border-radius:50%;border:1px solid var(--black-border);background:transparent;color:var(--text-primary);font-size:20px;line-height:1;cursor:pointer;z-index:2;transition:border-color .2s,background .2s}
.search .cal-arrow:hover:not(:disabled){border-color:var(--gold);background:var(--tint)}
.search .cal-arrow:disabled{opacity:.3;cursor:default}
.search .cal-prev{left:14px}.search .cal-next{right:14px}
.search .cal-months{display:flex;gap:32px}
.search .cal-month{flex:1;min-width:0}
.search .cal-title{text-align:center;font-family:var(--card-font);font-size:20px;line-height:36px;margin-bottom:10px;color:var(--text-primary)}
.search .cal-week,.search .cal-days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.search .cal-week span{text-align:center;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted);padding-bottom:6px}
.search .dw{height:40px;display:flex;align-items:center;justify-content:center}
.search .dbtn{width:38px;height:38px;border-radius:50%;border:0;background:transparent;color:var(--text-primary);font:inherit;font-size:14px;cursor:pointer;transition:background .15s,color .15s}
.search .dbtn:hover:not(:disabled):not(.sel){background:var(--tint)}
.search .dbtn:disabled{opacity:.3;cursor:default}
.search .dbtn.today{box-shadow:inset 0 0 0 1px var(--gold)}
.search .dbtn.sel{background:var(--gold);color:var(--black);font-weight:600;box-shadow:0 4px 14px var(--glow)}
.search .dw.mid{background:var(--tint)}
.search .dw.mid:nth-child(7n+1){border-radius:20px 0 0 20px}
.search .dw.mid:nth-child(7n){border-radius:0 20px 20px 0}
.search .dw.rs{background:linear-gradient(to right,transparent 50%,var(--tint) 50%)}
.search .dw.re{background:linear-gradient(to left,transparent 50%,var(--tint) 50%)}
.search .cal-info{text-align:center;margin-top:12px;font-size:13px;color:var(--text-secondary);min-height:1.2em}
.search .search-status{margin-top:12px;padding:0 8px;font-size:13px;color:var(--text-secondary);min-height:1.2em;text-align:center}
.busy-note{display:inline-block;align-self:flex-start;padding:4px 14px;border:1px solid var(--gold);border-radius:999px;font-family:var(--text-font);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-primary)}
@media(max-width:700px){.search{margin:-16px 0 32px;padding:12px;border-radius:24px}.search .sfield{flex:1 1 100%;padding:0 2px}.search .shalf{padding:8px 12px}.search .spill{flex:1 1 100%}.search .cal{padding:18px 8px 12px}.search .cal-prev{left:8px}.search .cal-next{right:8px}.search .dbtn{width:36px;height:36px}}
.card.busy{opacity:.55;filter:grayscale(1)}
.card.busy:hover{border-color:var(--black-border)}
.msg{text-align:center;color:var(--text-muted);font-size:13px;padding:60px 20px;grid-column:1/-1}
footer{padding:40px 60px;border-top:1px solid var(--black-border);text-align:center;font-size:11px;color:var(--text-muted);letter-spacing:.1em}
@media(max-width:768px){header{padding:20px 24px}.container{padding:36px 16px}h1{font-size:calc(32px * var(--title-scale))}.cards,.cards.cols-2,.cards.cols-3,.cards.cols-4{grid-template-columns:minmax(0,1fr);gap:24px}.logo{font-size:calc(20px * var(--brand-scale))}footer{padding:24px}.arrow{width:38px;height:38px}}
</style>

<script>
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

// Слайдер фото: стрелки, точки, свайп, клавиши ← →. Фото подгружаются по мере листания (текущее и соседнее).
function buildSlider(photos, name) {
  const slider = el('div', 'slider');
  if (!photos.length) {
    slider.classList.add('empty');
    slider.textContent = '🏠';
    return slider;
  }
  slider.tabIndex = 0;
  const track = el('div', 'track');
  const imgs = photos.map((p, i) => {
    const slide = el('div', 'slide');
    const img = document.createElement('img');
    img.alt = p.label && p.label !== '' ? p.label : name;
    img.decoding = 'async';
    img.dataset.src = p.url;
    slide.appendChild(img);
    track.appendChild(slide);
    return img;
  });
  slider.appendChild(track);
  let current = 0;
  const dots = el('div', 'dots');
  const counter = el('div', 'counter');
  const load = i => { const im = imgs[(i + imgs.length) % imgs.length]; if (im.dataset.src) { im.src = im.dataset.src; delete im.dataset.src; } };
  function show(i) {
    current = (i + photos.length) % photos.length;
    track.style.transform = 'translateX(-' + (current * 100) + '%)';
    load(current); load(current + 1);
    [...dots.children].forEach((d, n) => d.classList.toggle('on', n === current));
    counter.textContent = (current + 1) + ' / ' + photos.length;
  }
  if (photos.length > 1) {
    photos.forEach(() => dots.appendChild(el('span')));
    const prev = el('button', 'arrow prev', '‹'); prev.type = 'button'; prev.setAttribute('aria-label', 'Предыдущее фото');
    const next = el('button', 'arrow next', '›'); next.type = 'button'; next.setAttribute('aria-label', 'Следующее фото');
    prev.onclick = () => show(current - 1);
    next.onclick = () => show(current + 1);
    slider.append(prev, next, dots, counter);
    slider.addEventListener('keydown', e => { if (e.key === 'ArrowLeft') show(current - 1); if (e.key === 'ArrowRight') show(current + 1); });
    let startX = null, startY = null;
    slider.addEventListener('touchstart', e => { startX = e.touches[0].clientX; startY = e.touches[0].clientY; }, {passive: true});
    slider.addEventListener('touchend', e => {
      if (startX === null) return;
      const dx = e.changedTouches[0].clientX - startX, dy = e.changedTouches[0].clientY - startY;
      if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) show(current + (dx < 0 ? 1 : -1));
      startX = null;
    }, {passive: true});
  }
  show(0);
  return slider;
}

// Шрифты страницы (настраиваются в админке: «Каталог сайта»). Все с поддержкой кириллицы.
const FONTS = {
  cormorant:  {family: "'Cormorant Garamond',serif", weight: 400},
  im_fell:    {family: "'PT Serif',serif",            weight: 700},
  unifraktur: {family: "'Yeseva One',serif",          weight: 400},
  tangerine:  {family: "'Marck Script',cursive",      weight: 400},
  pacifico:   {family: "'Pacifico',cursive",          weight: 400},
  berkshire:  {family: "'Bad Script',cursive",        weight: 400},
  poiret:     {family: "'Poiret One',sans-serif",     weight: 400},
  montserrat: {family: "'Montserrat',sans-serif",     weight: 400},
};
const FONT_DEFAULTS = {brand: 'cormorant', title: 'cormorant', subtitle: 'montserrat', card: 'cormorant', text: 'montserrat'};

// Применяет шрифты и возвращает список загрузок шрифтов (чтобы показать страницу, когда они готовы)
function applyFonts(fonts) {
  fonts = fonts || {};
  const root = document.documentElement;
  const loads = [];
  Object.keys(FONT_DEFAULTS).forEach(g => {
    const key = FONTS[fonts[g + '_font']] ? fonts[g + '_font'] : FONT_DEFAULTS[g];
    const f = FONTS[key];
    const light = key === 'cormorant' && (g === 'brand' || g === 'title');   // как раньше: тонкое начертание для шапки и заголовка
    const weight = fonts[g + '_bold'] ? 700 : (light ? 300 : f.weight);
    const scale = Number(fonts[g + '_scale']) || 1;
    root.style.setProperty('--' + g + '-font', f.family);
    root.style.setProperty('--' + g + '-weight', weight);
    root.style.setProperty('--' + g + '-scale', scale);
    if (document.fonts && document.fonts.load) loads.push(document.fonts.load(weight + ' 1em ' + f.family).catch(() => {}));
  });
  return loads;
}

function buildCard(item) {
  const card = el('article', 'card');
  card.dataset.id = item.id;
  card.appendChild(buildSlider(item.photos || [], item.name));
  const body = el('div', 'body');
  const h = el('h2', 'name');
  const link = el('a', null, item.name);
  link.href = item.url;
  h.appendChild(link);
  body.appendChild(h);
  if (item.caption) body.appendChild(el('div', 'caption', item.caption));
  if (item.amenities && item.amenities.length) {
    const amen = el('div', 'amen');
    item.amenities.forEach(a => amen.appendChild(el('span', null, ((a.icon ? a.icon + ' ' : '') + a.name))));
    body.appendChild(amen);
  }
  const foot = el('div', 'foot');
  const price = el('div', 'price');
  if (item.price_from > 0) {
    price.append('от ');
    price.appendChild(el('b', null, item.price_from.toLocaleString('ru-RU') + ' ₽'));
    price.append(' / сутки');
  }
  const btn = el('a', 'btn btn-primary', 'Смотреть апартаменты');
  btn.href = item.url;
  foot.append(price, btn);
  body.appendChild(foot);
  card.appendChild(body);
  return card;
}

// Поиск по датам (включается в админке: «Каталог сайта»). Занятые на эти даты карточки остаются в списке серыми.
function iso(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }

function markBusy(busyIds) {
  document.querySelectorAll('.card[data-id]').forEach(card => {
    const busy = busyIds !== null && busyIds.includes(Number(card.dataset.id));
    card.classList.toggle('busy', busy);
    let note = card.querySelector('.busy-note');
    if (busy && !note) {
      note = el('div', 'busy-note', 'Занято на эти даты');
      card.querySelector('.body').insertBefore(note, card.querySelector('.foot'));
    } else if (!busy && note) {
      note.remove();
    }
  });
}

function ruNights(n) {
  const m = n % 100, d = n % 10;
  return n + ' ' + ((m >= 11 && m <= 14) ? 'ночей' : d === 1 ? 'ночь' : (d >= 2 && d <= 4) ? 'ночи' : 'ночей');
}
function parseIso(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
function fmtDay(s) { return parseIso(s).toLocaleDateString('ru-RU', { weekday: 'short', day: 'numeric', month: 'short' }); }

// Свой календарь: встроенный календарь браузера нельзя оформить под стиль сайта
function setupSearch(total) {
  const box = document.getElementById('search'), cal = document.getElementById('cal'), grid = document.getElementById('calMonths');
  const fld = document.getElementById('sField'), hIn = document.getElementById('sHalfIn'), hOut = document.getElementById('sHalfOut');
  const vIn = document.getElementById('sValIn'), vOut = document.getElementById('sValOut');
  const go = document.getElementById('sGo'), reset = document.getElementById('sReset'), status = document.getElementById('sStatus');
  const prev = document.getElementById('calPrev'), next = document.getElementById('calNext'), info = document.getElementById('calInfo');
  const today = iso(new Date()), now = new Date();
  const minMonth = now.getFullYear() * 12 + now.getMonth(), maxMonth = minMonth + 17;
  const wide = window.matchMedia('(min-width: 700px)');
  let selIn = '', selOut = '', hover = '', view = minMonth;
  const cells = [];
  box.classList.add('on');

  function syncFields() {
    vIn.textContent = selIn ? fmtDay(selIn) : 'Выберите дату'; vIn.classList.toggle('ph', !selIn);
    vOut.textContent = selOut ? fmtDay(selOut) : 'Выберите дату'; vOut.classList.toggle('ph', !selOut);
    const open = !cal.hidden, stepIn = !selIn || !!selOut;
    fld.classList.toggle('act', open);
    hIn.classList.toggle('act', open && stepIn);
    hOut.classList.toggle('act', open && !stepIn);
    info.textContent = selIn && selOut ? 'Выбрано: ' + ruNights(Math.round((parseIso(selOut) - parseIso(selIn)) / 86400000))
      : selIn ? 'Теперь выберите дату выезда' : 'Выберите дату заезда';
  }

  function paint() {
    const end = selOut || (selIn && hover > selIn ? hover : '');
    cells.forEach(({ s, w, b }) => {
      const isStart = s === selIn, isEnd = !!end && s === end;
      w.className = 'dw' + (selIn && end && s > selIn && s < end ? ' mid' : '') + (isStart && end ? ' rs' : '') + (isEnd ? ' re' : '');
      b.className = 'dbtn' + (s === today ? ' today' : '') + (isStart || isEnd ? ' sel' : '');
    });
  }

  function build() {
    grid.innerHTML = ''; cells.length = 0;
    const count = wide.matches ? 2 : 1;
    for (let k = 0; k < count; k++) {
      const idx = view + k, y = Math.floor(idx / 12), mo = idx % 12;
      const month = el('div', 'cal-month');
      const title = new Date(y, mo, 1).toLocaleDateString('ru-RU', { month: 'long', year: 'numeric' });
      month.appendChild(el('div', 'cal-title', title.charAt(0).toUpperCase() + title.slice(1)));
      const week = el('div', 'cal-week');
      ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'].forEach(n => week.appendChild(el('span', '', n)));
      month.appendChild(week);
      const days = el('div', 'cal-days');
      const lead = (new Date(y, mo, 1).getDay() + 6) % 7;
      for (let i = 0; i < lead; i++) days.appendChild(el('span', 'dw'));
      const last = new Date(y, mo + 1, 0).getDate();
      for (let d = 1; d <= last; d++) {
        const s = iso(new Date(y, mo, d));
        const w = el('span', 'dw'), b = el('button', 'dbtn', String(d));
        b.type = 'button'; b.dataset.d = s; b.disabled = s < today;
        w.appendChild(b); days.appendChild(w); cells.push({ s, w, b });
      }
      month.appendChild(days);
      grid.appendChild(month);
    }
    prev.disabled = view <= minMonth;
    next.disabled = view + count - 1 >= maxMonth;
    paint();
  }

  function openCal() { if (cal.hidden) { cal.hidden = false; build(); } syncFields(); }
  function closeCal() { cal.hidden = true; hover = ''; syncFields(); }

  fld.addEventListener('click', () => { if (cal.hidden) openCal(); else closeCal(); });
  prev.addEventListener('click', () => { if (view > minMonth) { view--; build(); } });
  next.addEventListener('click', () => { if (view + (wide.matches ? 2 : 1) - 1 < maxMonth) { view++; build(); } });
  grid.addEventListener('click', e => {
    const b = e.target.closest('.dbtn');
    if (!b || b.disabled) return;
    const s = b.dataset.d;
    if (!selIn || selOut || s <= selIn) { selIn = s; selOut = ''; hover = ''; paint(); syncFields(); }
    else { selOut = s; hover = ''; paint(); closeCal(); }
  });
  grid.addEventListener('mouseover', e => {
    const b = e.target.closest('.dbtn');
    if (!b || b.disabled || !selIn || selOut || hover === b.dataset.d) return;
    hover = b.dataset.d; paint();
  });
  grid.addEventListener('mouseleave', () => { if (hover) { hover = ''; paint(); } });
  document.addEventListener('click', e => { if (!cal.hidden && !box.contains(e.target)) closeCal(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !cal.hidden) closeCal(); });
  if (wide.addEventListener) wide.addEventListener('change', () => { if (!cal.hidden) build(); });

  go.onclick = async () => {
    if (!selIn || !selOut) { status.textContent = 'Выберите даты заезда и выезда'; openCal(); return; }
    go.disabled = true; status.textContent = 'Ищем…';
    try {
      const r = await fetch('/api/catalog/availability?check_in=' + encodeURIComponent(selIn) + '&check_out=' + encodeURIComponent(selOut));
      const data = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(data.detail || 'Не удалось выполнить поиск');
      markBusy(data.busy);
      const free = total - data.busy.length;
      status.textContent = free > 0 ? 'Свободно на эти даты: ' + free + ' из ' + total : 'На эти даты всё занято. Попробуйте другие даты.';
      reset.hidden = false;
    } catch (e) {
      status.textContent = e.message || 'Не удалось выполнить поиск. Попробуйте ещё раз.';
    } finally {
      go.disabled = false;
    }
  };
  reset.onclick = () => { selIn = ''; selOut = ''; hover = ''; markBusy(null); status.textContent = ''; reset.hidden = true; if (!cal.hidden) paint(); syncFields(); };
  syncFields();
}

async function loadCatalog() {
  const cards = document.getElementById('cards');
  // стиль сайта (режим фона и карточек) берём из настроек основного объекта
  const stylePromise = fetch('/api/site-settings').then(r => r.json()).then(s => {
    if (window.CityPauseTheme) window.CityPauseTheme.applyStyle(s);
    try { localStorage.setItem('cpCatalogStyle', JSON.stringify({mode: s.style_mode || '', hero: s.hero_photo || ''})); } catch (e) {}
  }).catch(() => {});
  try {
    const r = await fetch('/api/catalog');
    if (!r.ok) throw new Error(r.status);
    const data = await r.json();
    if (window.CityPauseTheme) window.CityPauseTheme.apply(data.background_theme, data.color_theme);
    try { localStorage.setItem('cpCatalogTheme', JSON.stringify({bg: data.background_theme, color: data.color_theme})); } catch (e) {}
    document.getElementById('brand').textContent = data.brand;
    document.getElementById('pageTitle').textContent = data.title;
    document.getElementById('pageSubtitle').textContent = data.subtitle;
    document.getElementById('footer').textContent = '© ' + new Date().getFullYear() + ' ' + data.brand;
    document.title = data.title + ' — ' + data.brand;
    const fontLoads = applyFonts(data.fonts);
    const columns = ['1', '2', '3', '4'].includes(String(data.columns)) ? String(data.columns) : 'auto';
    cards.classList.add('cols-' + columns);
    document.querySelector('.container').classList.toggle('wide', columns === '4');
    cards.innerHTML = '';
    if (!data.items.length) {
      cards.appendChild(el('div', 'msg', 'Скоро здесь появятся апартаменты.'));
    } else {
      cards.classList.toggle('single', data.items.length === 1);
      data.items.forEach(item => cards.appendChild(buildCard(item)));
      if (data.date_search) setupSearch(data.items.length);
    }
    // показываем страницу, когда нужные шрифты загружены (но не дольше 1,5 сек)
    await Promise.race([Promise.all([...fontLoads, stylePromise]), new Promise(r => setTimeout(r, 1500))]);
  } catch (e) {
    cards.innerHTML = '';
    cards.appendChild(el('div', 'msg', 'Не удалось загрузить каталог. Попробуйте обновить страницу.'));
  } finally {
    document.documentElement.classList.remove('cp-wait');
  }
}
loadCatalog();
</script>

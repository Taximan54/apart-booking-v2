<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Скидки и акции — Городская Пауза</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--gold:#C9A84C;--black:#0A0A0A;--black-card:#141414;--black-border:#1E1E1E;--text-primary:#F0E6C8;--text-secondary:#A89060;--text-muted:#5A4A30;}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Montserrat',sans-serif;background:var(--black);color:var(--text-primary);line-height:1.7;min-height:100vh}
header{padding:24px 60px;border-bottom:1px solid var(--black-border);display:flex;align-items:center;justify-content:space-between}
.logo{font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:300;color:var(--gold);letter-spacing:.3em;text-decoration:none}
.back{font-size:11px;letter-spacing:.2em;color:var(--text-muted);text-decoration:none;text-transform:uppercase;transition:color .3s}
.back:hover{color:var(--gold)}
.container{max-width:1000px;margin:0 auto;padding:60px 40px}
h1{font-family:'Cormorant Garamond',serif;font-size:42px;font-weight:300;color:var(--text-primary);margin-bottom:12px;text-align:center}
.subtitle{font-size:13px;color:var(--text-muted);text-align:center;margin-bottom:56px;letter-spacing:.05em}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:28px}
.card{background:var(--black-card);border:1px solid var(--black-border);overflow:hidden;transition:border-color .3s}
.card:hover{border-color:rgba(201,168,76,.4)}
.card-photo{width:100%;height:190px;background:#000;overflow:hidden}
.card-photo img{width:100%;height:100%;object-fit:cover}
.card-photo.placeholder{display:flex;align-items:center;justify-content:center;font-size:36px;color:var(--text-muted)}
.card-body{padding:22px}
.card-title{font-size:17px;color:var(--text-primary);margin-bottom:10px;font-weight:500}
.card-desc{font-size:13px;color:var(--text-secondary);font-weight:300;white-space:pre-line}
.empty{text-align:center;color:var(--text-muted);font-size:13px;padding:60px 20px}
footer{padding:40px 60px;border-top:1px solid var(--black-border);text-align:center;font-size:11px;color:var(--text-muted);letter-spacing:.1em}
footer a{color:var(--gold);text-decoration:none}
</style>
</head>
<body>

<header>
  <a href="index.html" class="logo">Городская Пауза</a>
  <a href="index.html" class="back">← На главную</a>
</header>

<div class="container">
  <h1>Скидки и акции</h1>
  <div class="subtitle">Актуальные предложения для гостей Городской Паузы</div>
  <div class="grid" id="discountsGrid">
    <div class="empty">Загрузка…</div>
  </div>
</div>

<footer>© 2026 Городская Пауза · <a href="index.html">На главную</a></footer>

<script>
const API_BASE = 'https://citypause.ru';
async function loadDiscounts() {
  const grid = document.getElementById('discountsGrid');
  try {
    const r = await fetch(`${API_BASE}/api/discounts`);
    const items = await r.json();
    if (!items || items.length === 0) {
      grid.innerHTML = '<div class="empty">Сейчас действующих акций нет — загляните позже.</div>';
      return;
    }
    grid.innerHTML = items.map(d => `
      <div class="card">
        <div class="card-photo ${d.photo ? '' : 'placeholder'}">
          ${d.photo ? `<img src="${API_BASE}/data/photos/${d.photo}" alt="${d.name}">` : '🏷️'}
        </div>
        <div class="card-body">
          <div class="card-title">${d.name}</div>
          <div class="card-desc">${d.description || ''}</div>
        </div>
      </div>
    `).join('');
  } catch (e) {
    grid.innerHTML = '<div class="empty">Не удалось загрузить акции. Попробуйте обновить страницу.</div>';
  }
}
loadDiscounts();
</script>
</body>
</html>

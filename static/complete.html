<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Заполнение данных и подписание — Городская Пауза</title>
<style>
  :root{
    --black:#0A0A0A; --panel:#141414; --border:#1E1E1E;
    --gold:#C9A84C; --text:#F0E6C8; --muted:#A89060; --red:#c0392b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--black);color:var(--text);font-family:Arial,sans-serif;padding:24px 16px 60px}
  .wrap{max-width:600px;margin:0 auto}
  .logo{text-align:center;font-size:24px;letter-spacing:4px;color:var(--gold);margin-bottom:28px}
  .card{background:var(--panel);border:1px solid var(--border);padding:24px;margin-bottom:20px;border-radius:2px}
  .label{font-size:11px;color:var(--gold);letter-spacing:.08em;text-transform:uppercase;margin-bottom:12px}
  .doc{white-space:pre-wrap;font-family:'Courier New',monospace;font-size:12px;line-height:1.6;color:var(--muted);
    max-height:280px;overflow-y:auto;padding-right:6px;border-top:1px solid var(--border);margin-top:12px;padding-top:12px}
  .btn{display:block;width:100%;background:var(--gold);color:var(--black);border:none;padding:14px;
    font-size:13px;font-weight:bold;letter-spacing:.04em;cursor:pointer;border-radius:2px;margin-top:14px}
  .btn:disabled{opacity:.5;cursor:default}
  .btn-outline{background:transparent;border:1px solid var(--gold);color:var(--gold)}
  .msg{font-size:12px;line-height:1.6;color:var(--muted);margin-top:10px}
  .err{color:var(--red)}
  .ok{color:var(--gold)}
  .hidden{display:none}
  .center{text-align:center}
  input[type=text]{width:100%;background:var(--black);border:1px solid var(--border);color:var(--text);
    padding:12px;font-size:14px;border-radius:2px;margin-top:6px}
  .field-label{font-size:12px;color:var(--muted);margin-top:16px}
  .photo-row{display:flex;flex-direction:column;gap:8px;margin-top:14px}
  .photo-status{font-size:12px}
  .photo-status.done{color:var(--gold)}
  .photo-status.pending{color:var(--muted)}
  input[type=file]{display:none}
  .file-btn{display:inline-block;border:1px solid var(--border);color:var(--text);padding:10px 16px;
    font-size:12px;border-radius:2px;cursor:pointer;margin-top:6px}
  .checkline{display:flex;align-items:flex-start;gap:10px;margin-top:14px;font-size:12px;color:var(--muted);line-height:1.5}
  .checkline input{margin-top:3px;accent-color:var(--gold);width:16px;height:16px;flex-shrink:0}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">ГОРОДСКАЯ ПАУЗА</div>

  <div id="loading" class="card center">Загрузка…</div>

  <div id="content" class="hidden">
    <div class="card">
      <div class="label">Договор аренды — <span id="bookingRef"></span></div>
      <div id="contractText" class="doc"></div>
    </div>

    <div class="card">
      <div class="label">Согласие на обработку персональных данных</div>
      <div id="consentText" class="doc"></div>
    </div>

    <div id="formCard" class="card">
      <div class="label">Ваши данные</div>

      <div id="passportField" class="hidden">
        <div class="field-label">Паспортные данные (серия, номер)</div>
        <input type="text" id="passportInput" placeholder="0000 000000" maxlength="11" oninput="formatPassportInput(this)">
      </div>

      <div class="photo-row">
        <div>
          <div class="field-label">Фото разворота паспорта</div>
          <label class="file-btn" for="fileMain">Выбрать файл</label>
          <input type="file" id="fileMain" accept="image/*" onchange="uploadPhoto('main', this)">
          <div class="photo-status pending" id="statusMain">Не загружено</div>
        </div>
        <div>
          <div class="field-label">Фото страницы с пропиской</div>
          <label class="file-btn" for="fileReg1">Выбрать файл</label>
          <input type="file" id="fileReg1" accept="image/*" onchange="uploadPhoto('reg1', this)">
          <div class="photo-status pending" id="statusReg1">Не загружено</div>
        </div>
      </div>

      <label class="checkline">
        <input type="checkbox" id="privacyCheck">
        Даю согласие на обработку персональных данных в соответствии с условиями выше
      </label>
      <label class="checkline">
        <input type="checkbox" id="contractCheck">
        Ознакомлен(а) и согласен(на) с условиями договора аренды выше
      </label>

      <button class="btn" id="signBtn" onclick="signNow()" disabled>Подписать договор</button>
      <div id="signMsg" class="msg"></div>
    </div>
  </div>

  <div id="alreadySigned" class="card center hidden">
    <div class="label">✅ Договор уже подписан</div>
    <div class="msg" id="signedAtText"></div>
  </div>

  <div id="notFound" class="card center hidden">
    <div class="msg err">Ссылка недействительна или устарела. Свяжитесь с администратором.</div>
  </div>
</div>

<script>
const token = window.location.pathname.split('/').filter(Boolean).pop();
let photosState = { main: false, reg1: false };
let passportNeeded = false;

function formatPassportInput(el){
  let digits = el.value.replace(/\D/g, '').slice(0, 10);
  let out = digits.slice(0,4);
  if(digits.length > 4) out += ' ' + digits.slice(4,10);
  el.value = out;
}
function isPassportComplete(el){
  const digits = el.value.replace(/\D/g, '');
  return digits.length === 10;
}

function updateSignButton() {
  const btn = document.getElementById('signBtn');
  const passportOk = !passportNeeded || isPassportComplete(document.getElementById('passportInput'));
  const photosOk = photosState.main && photosState.reg1;
  const checksOk = document.getElementById('privacyCheck').checked && document.getElementById('contractCheck').checked;
  btn.disabled = !(passportOk && photosOk && checksOk);
}

async function init() {
  try {
    const r = await fetch(`/api/complete/${token}`);
    if (!r.ok) throw new Error('not_found');
    const data = await r.json();
    document.getElementById('loading').classList.add('hidden');

    if (data.already_signed) {
      document.getElementById('alreadySigned').classList.remove('hidden');
      document.getElementById('signedAtText').textContent = `Дата подписания: ${data.signed_at}`;
      return;
    }

    document.getElementById('content').classList.remove('hidden');
    document.getElementById('bookingRef').textContent = data.booking_ref || '';
    document.getElementById('contractText').textContent = data.contract_text || '';
    document.getElementById('consentText').textContent = data.consent_text || '';

    passportNeeded = !!data.passport_needed;
    if (passportNeeded) document.getElementById('passportField').classList.remove('hidden');

    photosState.main = !!(data.photos_uploaded && data.photos_uploaded.main);
    photosState.reg1 = !!(data.photos_uploaded && data.photos_uploaded.reg1);
    if (photosState.main) { document.getElementById('statusMain').textContent = 'Загружено ✓'; document.getElementById('statusMain').className = 'photo-status done'; }
    if (photosState.reg1) { document.getElementById('statusReg1').textContent = 'Загружено ✓'; document.getElementById('statusReg1').className = 'photo-status done'; }

    document.getElementById('passportInput').addEventListener('input', updateSignButton);
    document.getElementById('privacyCheck').addEventListener('change', updateSignButton);
    document.getElementById('contractCheck').addEventListener('change', updateSignButton);
    updateSignButton();
  } catch (e) {
    document.getElementById('loading').classList.add('hidden');
    document.getElementById('notFound').classList.remove('hidden');
  }
}

async function uploadPhoto(slot, input) {
  const file = input.files[0];
  if (!file) return;
  const statusEl = document.getElementById(slot === 'main' ? 'statusMain' : 'statusReg1');
  statusEl.textContent = 'Загрузка…';
  statusEl.className = 'photo-status pending';

  const formData = new FormData();
  formData.append('slot', slot);
  formData.append('file', file);

  try {
    const r = await fetch(`/api/complete/${token}/upload-photo`, { method: 'POST', body: formData });
    const data = await r.json();
    if (!r.ok) throw new Error(data.detail || 'Ошибка загрузки');
    photosState[slot] = true;
    statusEl.textContent = 'Загружено ✓';
    statusEl.className = 'photo-status done';
    updateSignButton();
  } catch (e) {
    statusEl.textContent = e.message;
    statusEl.className = 'photo-status err';
  }
}

async function signNow() {
  const btn = document.getElementById('signBtn');
  const msg = document.getElementById('signMsg');
  btn.disabled = true;
  msg.textContent = ''; msg.className = 'msg';

  try {
    const r = await fetch(`/api/complete/${token}/submit`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ passport: document.getElementById('passportInput').value.trim() })
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.detail || 'Не удалось подписать договор');

    document.getElementById('formCard').innerHTML =
      `<div class="label">✅ Договор подписан</div>
       <div class="msg ok">Дата подписания: ${data.signed_at}. Подписанный договор и
       согласие на обработку персональных данных отправлены вам на email.</div>`;
  } catch (e) {
    msg.textContent = e.message;
    msg.className = 'msg err';
    updateSignButton();
  }
}

init();
</script>
</body>
</html>
